<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ateliê R.Y. – Costura & Ajustes | Ruth Yana</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --rosa-pastel: #F4C2C2;
            --beige: #F5E6D3;
            --verde-folha: #A8C5A6;
            --marrom-claro: #D4B5A0;
            --branco: #FFFFFF;
            --texto-escuro: #5A4A42;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--beige) 0%, #FFF8F0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--texto-escuro);
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--branco);
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Decoração sutil no topo */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--rosa-pastel), var(--verde-folha), var(--marrom-claro));
        }

        /* Área do logo */
        .logo-area {
            margin-bottom: 25px;
            position: relative;
        }

        .logo-placeholder {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, var(--rosa-pastel) 0%, var(--marrom-claro) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(244, 194, 194, 0.3);
            font-size: 48px;
            color: var(--branco);
            border: 4px solid var(--branco);
            overflow: hidden;
            position: relative;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .logo-placeholder i {
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--texto-escuro);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 14px;
            color: #8B7968;
            font-weight: 300;
            margin-bottom: 5px;
        }

        .location {
            font-size: 13px;
            color: #A89080;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-bottom: 10px;
        }

        .phone {
            font-size: 15px;
            color: var(--verde-folha);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-bottom: 25px;
        }

        .description {
            font-size: 14px;
            line-height: 1.6;
            color: #6B5B52;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* Links sociais */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 25px;
            background: var(--branco);
            border: 2px solid #E8D8C8;
            border-radius: 50px;
            text-decoration: none;
            color: var(--texto-escuro);
            font-weight: 500;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(244, 194, 194, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .social-link:hover::before {
            left: 100%;
        }

        .social-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .social-link.facebook {
            border-color: #1877F2;
        }

        .social-link.facebook:hover {
            background: #1877F2;
            color: var(--branco);
            border-color: #1877F2;
        }

        .social-link.instagram {
            border-color: #E4405F;
        }

        .social-link.instagram:hover {
            background: linear-gradient(45deg, #F58529, #DD2A7B, #8134AF);
            color: var(--branco);
            border-color: #E4405F;
        }

        .social-link.tiktok {
            border-color: #000000;
        }

        .social-link.tiktok:hover {
            background: #000000;
            color: var(--branco);
            border-color: #000000;
        }

        .social-link.whatsapp {
            border-color: #25D366;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: var(--branco);
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .social-link.whatsapp:hover {
            background: linear-gradient(135deg, #128C7E 0%, #075E54 100%);
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }

        .social-link.maps {
            border-color: var(--verde-folha);
        }

        .social-link.maps:hover {
            background: var(--verde-folha);
            color: var(--branco);
            border-color: var(--verde-folha);
        }

        .social-link i {
            font-size: 24px;
            transition: transform 0.3s ease;
        }

        .social-link:hover i {
            transform: scale(1.1);
        }

        /* Footer */
        footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #E8D8C8;
            font-size: 12px;
            color: #A89080;
        }

        /* Decoração de costura */
        .stitch-decoration {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
        }

        .stitch-dot {
            width: 6px;
            height: 6px;
            background: var(--rosa-pastel);
            border-radius: 50%;
            opacity: 0.6;
        }

        /* Responsivo para desktop */
        @media (min-width: 768px) {
            .container {
                padding: 50px 40px;
            }

            h1 {
                font-size: 32px;
            }

            .logo-placeholder {
                width: 140px;
                height: 140px;
                font-size: 56px;
            }

            .social-link {
                padding: 18px 30px;
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo Area -->

            <div class="logo-placeholder">
                <img src="./img/logo.jpg" alt="Ateliê R.Y. Logo">

        </div>

        <!-- Informações principais -->
        <h1>Ateliê R.Y.</h1>
        <p class="subtitle">Costura & Ajustes</p>

        <p class="phone">

        <!-- Links Sociais -->
        <div class="social-links">
            <a href="https://wa.me/5511942277711?text=Olá!%20Vi%20seu%20ateliê%20e%20gostaria%20de%20saber%20mais" class="social-link whatsapp" target="_blank" rel="noopener">

            <a href="https://www.facebook.com/profile.php?id=61587352551689" class="social-link facebook" target="_blank" rel="noopener">

            <a href="https://www.tiktok.com/@ruthyanamachaca?_r=1&_t=ZS-93ykZOWCrOH" class="social-link tiktok" target="_blank" rel="noopener">

            </a>

            <a href="https://maps.app.goo.gl/fDBQy3GYQtmaqdb39" class="social-link maps" target="_blank" rel="noopener">

        </div>

        <!-- Footer -->
        <footer>

    </div>
</body>
</html>
